[workspace]
resolver = "2"
members = [
    "crates/kafka-rpc-protocol",
    "crates/kafka-core",
    "crates/kafka-wire",
    "crates/kafka-schema-registry",
    "crates/kafka-connect-rest",
    "crates/kafka-bridge",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time"] }
rdkafka = { version = "0.39", features = ["tokio", "ssl-vendored"] }
base64 = "0.22"
futures = "0.3"
