name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  required:
    name: CI
    if: always()
    needs: [test, security-resilience, ecosystem]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all test suites to pass
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ["RESULTS"])
          sys.exit(0 if results and all(result == "success" for result in results) else 1)
          PY

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        emacs: ["29.4", "30.1", "snapshot"]
        kafka: ["3.9.1", "4.4.0"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/kafka-el/kafka_2.13-${{ matrix.kafka }}
          key: kafka-${{ matrix.kafka }}
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Byte-compile
        run: emacs -Q --batch -L lisp --eval '(setq byte-compile-error-on-warn t)' -f batch-byte-compile lisp/*.el
      - name: Test
        env:
          KAFKA_VERSION: ${{ matrix.kafka }}
        run: scripts/test-all.sh
      - name: Stop broker
        if: always()
        run: scripts/kafka-dev.sh stop
      - name: Broker logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: broker-${{ matrix.os }}-${{ matrix.emacs }}-${{ matrix.kafka }}
          path: ~/.cache/kafka-el/run-*/server.log

  security-resilience:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: purcell/setup-emacs@master
        with:
          version: "30.1"
      - name: Start fixtures
        run: |
          scripts/kafka-dev.sh start
          scripts/kafka-secure.sh start
          scripts/kafka-cluster.sh start
          KAFKA_SECURE_PORT=59092 KAFKA_SECURE_MECHANISMS=PLAIN scripts/kafka-secure.sh start
          KAFKA_CLUSTER_PORT=49092 scripts/kafka-cluster.sh start
      - name: Live secure/admin/wire/resilience suites
        run: |
          eval "$(scripts/kafka-secure.sh env)"
          eval "$(scripts/kafka-cluster.sh env)"
          export KAFKA_EL_TEST_SECURE_PLAIN_ONLY=127.0.0.1:59092
          export KAFKA_EL_TEST_RESILIENCE_CLUSTER=127.0.0.1:49092,127.0.0.1:49093,127.0.0.1:49094
          export KAFKA_EL_TEST_RESILIENCE_SCRIPT="$PWD/scripts/kafka-cluster.sh"
          scripts/test-all.sh
      - name: Stop fixtures
        if: always()
        run: |
          KAFKA_CLUSTER_PORT=49092 scripts/kafka-cluster.sh stop
          KAFKA_SECURE_PORT=59092 scripts/kafka-secure.sh stop
          scripts/kafka-cluster.sh stop
          scripts/kafka-secure.sh stop
          scripts/kafka-dev.sh stop
      - name: Fixture logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: security-resilience-logs
          path: |
            ~/.cache/kafka-el/secure-*/server.log
            ~/.cache/kafka-el/cluster-*/n*/server.log
            ~/.cache/kafka-el/run-*/server.log

  ecosystem:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KAFKA_HEAP_OPTS: -Xms128m -Xmx384m
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: purcell/setup-emacs@master
        with:
          version: "30.1"
      - name: Install fixture package manager
        run: |
          python3 -m venv "$RUNNER_TEMP/fixture-tools"
          "$RUNNER_TEMP/fixture-tools/bin/pip" install uv
          echo "$RUNNER_TEMP/fixture-tools/bin" >> "$GITHUB_PATH"
      - name: Start ecosystem fixtures
        run: |
          scripts/kafka-dev.sh start
          scripts/connect-dev.sh start
          scripts/schema-registry-dev.sh start
          KAFKA_EL_REGISTRY_AUTH=1 scripts/schema-registry-dev.sh start
          KAFKA_EL_REGISTRY_TLS=1 scripts/schema-registry-dev.sh start
      - name: Live REST and codec suites
        run: |
          eval "$(scripts/connect-dev.sh env)"
          eval "$(scripts/schema-registry-dev.sh env)"
          eval "$(KAFKA_EL_REGISTRY_AUTH=1 scripts/schema-registry-dev.sh env)"
          eval "$(KAFKA_EL_REGISTRY_TLS=1 scripts/schema-registry-dev.sh env)"
          scripts/test-all.sh
      - name: Stop ecosystem fixtures
        if: always()
        run: |
          KAFKA_EL_REGISTRY_TLS=1 scripts/schema-registry-dev.sh stop
          KAFKA_EL_REGISTRY_AUTH=1 scripts/schema-registry-dev.sh stop
          scripts/schema-registry-dev.sh stop
          scripts/connect-dev.sh stop
          scripts/kafka-dev.sh stop
      - name: Ecosystem logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ecosystem-logs
          path: |
            ~/.cache/kafka-el/registry-*/server.log
            ~/.cache/kafka-el/connect-*/worker.log
            ~/.cache/kafka-el/run-*/server.log
